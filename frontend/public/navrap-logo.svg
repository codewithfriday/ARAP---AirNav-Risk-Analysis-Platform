<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NAVRAP cheetah logo">
  <rect width="64" height="64" rx="14" fill="#1F3A5F"/>
  <!-- ears -->
  <path d="M12 24 Q10 9 22 13 Q20 20 17 26 Z" fill="#E9A23B" stroke="#7A4A12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M52 24 Q54 9 42 13 Q44 20 47 26 Z" fill="#E9A23B" stroke="#7A4A12" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M14.5 22 Q14 14 19.5 15.5 Q18 19 16.5 23 Z" fill="#4A2E12"/>
  <path d="M49.5 22 Q50 14 44.5 15.5 Q46 19 47.5 23 Z" fill="#4A2E12"/>
  <!-- head -->
  <ellipse cx="32" cy="35" rx="21" ry="19" fill="#F2B04A" stroke="#7A4A12" stroke-width="1.2"/>
  <!-- spots -->
  <g fill="#3B2410">
    <circle cx="26" cy="20" r="1.6"/><circle cx="32" cy="18" r="1.8"/><circle cx="38" cy="20" r="1.6"/>
    <circle cx="29" cy="23.5" r="1.1"/><circle cx="35" cy="23.5" r="1.1"/>
    <circle cx="14.5" cy="38" r="1.4"/><circle cx="16.5" cy="44" r="1.2"/><circle cx="49.5" cy="38" r="1.4"/><circle cx="47.5" cy="44" r="1.2"/>
  </g>
  <!-- muzzle -->
  <ellipse cx="32" cy="45.5" rx="11.5" ry="8" fill="#FFF3DC"/>
  <!-- tear marks -->
  <path d="M24.5 38.5 Q24 44 27.5 48" fill="none" stroke="#2A1A0A" stroke-width="2" stroke-linecap="round"/>
  <path d="M39.5 38.5 Q40 44 36.5 48" fill="none" stroke="#2A1A0A" stroke-width="2" stroke-linecap="round"/>
  <!-- nerd glasses -->
  <line x1="12" y1="31" x2="17" y2="32" stroke="#111" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="52" y1="31" x2="47" y2="32" stroke="#111" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="24" cy="32.5" r="7.2" fill="#E8F4FF" fill-opacity="0.9" stroke="#111" stroke-width="2.8"/>
  <circle cx="40" cy="32.5" r="7.2" fill="#E8F4FF" fill-opacity="0.9" stroke="#111" stroke-width="2.8"/>
  <path d="M30.6 31.5 Q32 29.8 33.4 31.5" fill="none" stroke="#111" stroke-width="2.6"/>
  <rect x="30.4" y="29.4" width="3.2" height="3.6" rx="0.6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="0.5"/>
  <!-- eyes -->
  <circle cx="25" cy="33.5" r="2.7" fill="#1A1A1A"/><circle cx="39" cy="33.5" r="2.7" fill="#1A1A1A"/>
  <circle cx="25.9" cy="32.5" r="0.9" fill="#fff"/><circle cx="39.9" cy="32.5" r="0.9" fill="#fff"/>
  <path d="M19 28 L22 27.4" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <path d="M35 28 L38 27.4" stroke="#fff" stroke-width="1" stroke-linecap="round" opacity="0.8"/>
  <!-- nose and mouth -->
  <path d="M28.6 42 Q32 40.6 35.4 42 Q33.6 45 32 45.2 Q30.4 45 28.6 42 Z" fill="#2A1A0A"/>
  <path d="M32 45.2 L32 47.2 M32 47.2 Q29.8 49.8 27.6 48.4 M32 47.2 Q34.2 49.8 36.4 48.4" fill="none" stroke="#2A1A0A" stroke-width="1.3" stroke-linecap="round"/>
  <!-- whisker dots -->
  <g fill="#B07A3A"><circle cx="26.5" cy="46" r="0.6"/><circle cx="25" cy="48" r="0.6"/><circle cx="37.5" cy="46" r="0.6"/><circle cx="39" cy="48" r="0.6"/></g>
</svg>
